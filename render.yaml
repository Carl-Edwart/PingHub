services:
  - type: web
    name: pinghub
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    # A aplicação aplica o schema no boot (DB_INIT_ON_START=1), inclusive se a
    # plataforma executar `gunicorn app:app` diretamente. O start.sh mantém
    # retries para banco lento e então inicia o Gunicorn. Nada apaga dados.
    startCommand: ./scripts/start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PINGHUB_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pinghub-db
          property: connectionString
      # Render solicita este valor no momento da criação do Blueprint.
      - key: ADMIN_PASSWORD
        sync: false
      # Render gera e mantém um segredo aleatório.
      - key: SECRET_KEY
        generateValue: true
      - key: DB_INIT_ON_START
        value: "1"
      # Fallback legado (1ª chamada /api) desligado: o boot é o caminho principal.
      - key: DB_AUTO_INIT
        value: "0"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: pinghub-db
    databaseName: pinghub
    user: pinghub
    plan: free
    region: virginia
    postgresMajorVersion: "16"
