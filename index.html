/* Comparativo: ELO, aproveitamento, sets, pontos, adversários em comum e confronto direto. */
const CMP_A_COLOR = '#60a5fa', CMP_B_COLOR = '#fb923c';

function compareFormChips(form) {
  if (!form?.length) return '<div class="small text-secondary mt-2">Sem partidas recentes</div>';
  return `<div class="cmp-form" aria-label="Últimas cinco partidas">${form.map(r =>
    `<span class="${r === 'W' ? 'w' : 'l'}" title="${r === 'W' ? 'Vitória' : 'Derrota'}">${r}</span>`).join('')}</div>`;
}

PH.routes.comparativo = async (paramA, paramB) => {
  const athletes = await api('/athletes');
  if (athletes.length < 2) {
    render(`<h2 class="ph-title mb-3">Comparativo de desempenho</h2>
      <div class="card p-4"><p class="text-secondary mb-3">Cadastre pelo menos dois atletas para comparar o desempenho.</p>
      <a href="#/atletas" class="btn btn-ph"><i class="bi bi-people"></i> Ver atletas</a></div>`);
    return;
  }
  const byElo = [...athletes].sort((x, y) => y.elo - x.elo || x.name.localeCompare(y.name));
  const find = id => athletes.find(a => String(a.id) === String(id));
  let aId = find(paramA)?.id ?? byElo[0].id;
  let bId = find(paramB)?.id ?? byElo.find(a => a.id !== aId)?.id;
  if (bId == null || bId === aId) bId = byElo.find(a => a.id !== aId).id;
  let prevA = aId, prevB = bId;
  const opts = selected => [...athletes].sort((x, y) => x.name.localeCompare(y.name)).map(a =>
    `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${esc(a.name)} — ELO ${a.elo}</option>`).join('');

  render(`<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <div><h2 class="ph-title m-0">Comparativo de desempenho</h2>
        <div class="small text-secondary mt-1">ELO, aproveitamento, sets, pontos e confrontos diretos.</div></div>
      <a href="#/ranking" class="btn btn-outline-light"><i class="bi bi-bar-chart-line"></i> Ranking</a></div>
    <div class="card p-3 mb-4"><div class="row g-3 align-items-end">
      <div class="col-12 col-md-5"><label class="form-label" for="cmpA">Atleta A</label>
        <select id="cmpA" class="form-select">${opts(aId)}</select></div>
      <div class="col-12 col-md-2 d-flex justify-content-center">
        <button id="cmpSwap" type="button" class="btn btn-outline-light w-100" title="Trocar atletas">
          <i class="bi bi-arrow-left-right"></i><span class="d-md-none"> Trocar</span></button></div>
      <div class="col-12 col-md-5"><label class="form-label" for="cmpB">Atleta B</label>
        <select id="cmpB" class="form-select">${opts(bId)}</select></div>
    </div></div>
    <div id="cmpBody"><div class="sk mb-3" style="height:150px"></div>
      <div class="row g-3"><div class="col-lg-7"><div class="sk" style="height:280px"></div></div>
      <div class="col-lg-5"><div class="sk" style="height:280px"></div></div></div></div>`);

  const paint = d => {
    const A = d.a.athlete, B = d.b.athlete;
    const sa = d.a.stats, sb = d.b.stats;
    const ta = d.a.titles.total || 0, tb = d.b.titles.total || 0;
    const pct = (n, total) => total ? Math.round(n / total * 100) : null;
    const winPct = a => a.wins + a.losses ? Math.round(a.wins / (a.wins + a.losses) * 100) : null;
    const setPct = st => st.sets_played ? Math.round(st.sets_won / st.sets_played * 100) : null;
    const pointPct = st => st.points_for + st.points_against ? Math.round(st.points_for / (st.points_for + st.points_against) * 100) : null;
    const pctText = v => v == null ? '—' : `${v}%`;
    const plain = v => v == null ? '—' : String(v);
    const streak = v => v > 0 ? `${v}V` : '—';

    const side = (a, st, titles, form, cls) => `<a class="cmp-side ${cls}" href="#/atletas/${a.id}" title="Abrir perfil de ${esc(a.name)}">
      ${avatar(a, true)}<div class="cmp-name">${esc(a.name)}</div><div class="cmp-nick">${esc(a.nickname || '')}</div>
      <div class="cmp-elo">${a.elo}</div>
      <div class="cmp-sub">${a.wins}V / ${a.losses}D${winPct(a) != null ? ` · ${winPct(a)}%` : ''}</div>
      ${compareFormChips(form)}
      <div class="badge text-bg-secondary mt-2">${titles} título${titles === 1 ? '' : 's'} · ${st.elo_matches || 0} partidas com ELO</div></a>`;

    const metric = (label, va, vb, fmt = plain) => {
      const aLead = va != null && (vb == null || va > vb), bLead = vb != null && (va == null || vb > va);
      const baseA = Math.max(0, Number(va) || 0), baseB = Math.max(0, Number(vb) || 0);
      const total = baseA + baseB, pctA = total ? baseA / total * 100 : 50;
      return `<div class="cmp-metric"><div class="cmp-metric-head">
          <span class="cmp-value a ${aLead ? 'lead-a' : ''}">${fmt(va)}</span>
          <span class="cmp-label">${label}</span>
          <span class="cmp-value b ${bLead ? 'lead-b' : ''}">${fmt(vb)}</span></div>
        <div class="cmp-bar"><span class="a" style="width:${pctA.toFixed(1)}%"></span><span class="b" style="width:${(100 - pctA).toFixed(1)}%"></span></div></div>`;
    };

    const metrics = metric('ELO atual', A.elo, B.elo) +
      metric('ELO máximo', sa.best_elo, sb.best_elo) +
      metric('Aproveitamento', winPct(A), winPct(B), pctText) +
      metric('Vitórias', A.wins, B.wins) +
      metric('Sets ganhos', setPct(sa), setPct(sb), pctText) +
      metric('Pontos ganhos', pointPct(sa), pointPct(sb), pctText) +
      metric('Vitórias seguidas', Math.max(0, sa.streak || 0), Math.max(0, sb.streak || 0), streak) +
      metric('Melhor sequência', sa.best_streak || 0, sb.best_streak || 0, streak) +
      metric('Títulos', ta, tb);

    const common = d.common.length ? `<div class="table-responsive"><table class="table table-sm cmp-common-table mb-0">
      <thead><tr><th class="text-end">${esc(A.name)}</th><th class="text-center">Adversário</th><th>${esc(B.name)}</th></tr></thead><tbody>
      ${d.common.map(o => {
        const ap = pct(o.a.wins, o.a.matches), bp = pct(o.b.wins, o.b.matches);
        return `<tr><td class="text-end"><b>${o.a.wins}–${o.a.matches - o.a.wins}</b>
            <span class="cmp-common-pct ${ap > bp ? 'lead' : ''}">${pctText(ap)}</span></td>
          <td class="text-center"><a href="#/atletas/${o.id}" class="text-decoration-none">${esc(o.name)}</a></td>
          <td><b>${o.b.wins}–${o.b.matches - o.b.wins}</b>
            <span class="cmp-common-pct ${bp > ap ? 'lead' : ''}">${pctText(bp)}</span></td></tr>`;
      }).join('')}</tbody></table></div>`
      : '<p class="text-secondary mb-0">Nenhum adversário em comum com partidas competitivas.</p>';

    const h2hRecent = d.h2h.recent.length ? d.h2h.recent.map(r => `<div class="cmp-h2h-row">
        <span class="date">${fmtDate(r.created_at)}</span>
        <span class="score">${r.a_sets} × ${r.b_sets}</span>
        <span class="winner"><span class="${r.winner === 'a' ? 'text-info' : 'text-warning'}">${esc(r.winner === 'a' ? A.name : B.name)}</span>
          <small class="text-secondary d-none d-md-inline">${(r.sets || []).map(s => s.join('-')).join(' · ')}</small></span>
        <span class="ms-auto small text-secondary text-nowrap">${r.tournament ? `<i class="bi bi-trophy"></i> ${esc(r.tournament)}` : `${r.points_per_set} pts`}</span>
      </div>`).join('') : '<p class="text-secondary mb-0">Ainda não houve confronto direto entre eles.</p>';

    const h2hSub = d.h2h.matches
      ? `${d.h2h.matches} partida${d.h2h.matches === 1 ? '' : 's'} · sets ${d.h2h.a_sets}–${d.h2h.b_sets} · pontos ${d.h2h.a_points}–${d.h2h.b_points}`
      : 'Ainda não se enfrentaram';
    const hasChart = d.a.elo_history.length || d.b.elo_history.length;
    const legend = `<span><i class="pdot" style="background:${CMP_A_COLOR}"></i>${esc(A.name)}</span>
      <span><i class="pdot" style="background:${CMP_B_COLOR}"></i>${esc(B.name)}</span>`;

    $('#cmpBody').innerHTML = `<div class="cmp-duel">
        ${side(A, sa, ta, d.form.a, '')}
        <div class="cmp-vs"><div class="small text-secondary text-uppercase" style="letter-spacing:.08em">Confronto direto</div>
          <div class="cmp-vs-score"><span class="a">${d.h2h.a_wins}</span><span class="text-secondary">×</span><span class="b">${d.h2h.b_wins}</span></div>
          <div class="small text-secondary">${h2hSub}</div></div>
        ${side(B, sb, tb, d.form.b, 'b')}</div>
      <div class="card p-3 mb-4"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <h5 class="m-0">Evolução do ELO</h5><span class="small text-secondary">Histórico completo de partidas com ELO</span></div>
        ${hasChart ? eloChartShell({ compare: true, legend }) : '<p class="text-secondary mb-0">Nenhum dos atletas tem partidas com ELO.</p>'}</div>
      <div class="row g-3 mb-4">
        <div class="col-lg-7"><div class="card p-3 h-100"><h5>Comparativo de números</h5>
          <div class="small text-secondary mb-2">Partidas competitivas individuais. O destaque mostra quem leva em cada critério.</div>${metrics}</div></div>
        <div class="col-lg-5"><div class="card p-3 h-100"><h5>Adversários em comum</h5>
          <div class="small text-secondary mb-2">Aproveitamento de cada atleta contra os mesmos rivais.</div>${common}</div></div>
      </div>
      <div class="card p-3"><h5>Últimos confrontos diretos</h5>
        <div class="small text-secondary mb-2">Vitórias de ${esc(A.name)} à esquerda; de ${esc(B.name)} à direita.</div>${h2hRecent}</div>`;

    if (hasChart) initEloExplorer($('#cmpBody .elo-explorer'), [
      { id: 'a', name: A.name, color: CMP_A_COLOR, history: d.a.elo_history },
      { id: 'b', name: B.name, color: CMP_B_COLOR, history: d.b.elo_history },
    ], { mode: 'compare' });
  };

  const load = async () => {
    aId = Number($('#cmpA').value); bId = Number($('#cmpB').value);
    prevA = aId; prevB = bId;
    window.history.replaceState(null, '', `#/comparativo/${aId}/${bId}`);
    $('#cmpBody').innerHTML = `<div class="sk mb-3" style="height:150px"></div>
      <div class="row g-3"><div class="col-lg-7"><div class="sk" style="height:280px"></div></div>
      <div class="col-lg-5"><div class="sk" style="height:280px"></div></div></div>`;
    paint(await api(`/compare?a=${aId}&b=${bId}`));
  };

  $('#cmpA').addEventListener('change', () => {
    if ($('#cmpA').value === $('#cmpB').value) $('#cmpB').value = String(prevA);
    load();
  });
  $('#cmpB').addEventListener('change', () => {
    if ($('#cmpB').value === $('#cmpA').value) $('#cmpA').value = String(prevB);
    load();
  });
  $('#cmpSwap').addEventListener('click', () => {
    const a = $('#cmpA').value;
    $('#cmpA').value = $('#cmpB').value;
    $('#cmpB').value = a;
    load();
  });
  await load();
};

function roundLabel(r, total) {
  const back = total - r;
  return back === 0 ? 'Final' : back === 1 ? 'Semifinal' : back === 2 ? 'Quartas de final' : `Rodada ${r}`;
}

function matchCard(m, tid) {
  const bye = m.status === 'done' && !m.match_id;
  const row = (name, score, win) => `<div class="row-p ${win ? 'win' : ''}"><span>${name ? esc(name) : '<i class="text-secondary">A definir</i>'}</span><span>${score ?? ''}</span></div>`;
  const played = !!m.match_id;
  const play = m.status === 'waiting' && m.player1_id && m.player2_id
    ? `<a class="btn btn-ph btn-go btn-sm w-100 mt-1" href="#/jogar/${tid}/${m.id}"><i class="bi bi-play-fill"></i> Jogar</a>` : '';
  return `<div class="bm">${row(m.p1_name, played ? m.sets_p1 : '', m.winner_id && m.winner_id === m.player1_id)}
    ${row(bye ? 'Folga' : m.p2_name, played ? m.sets_p2 : '', m.winner_id && m.winner_id === m.player2_id)}${play}</div>`;
}

function rrTable(players, matches) {
  const st = Object.fromEntries(players.map(p => [p.id, { name: p.name, w: 0, l: 0, sf: 0, sa: 0 }]));
  matches.filter(m => m.status === 'done' && st[m.player1_id] && st[m.player2_id]).forEach(m => {
    st[m.player1_id].sf += m.sets_p1; st[m.player1_id].sa += m.sets_p2;
    st[m.player2_id].sf += m.sets_p2; st[m.player2_id].sa += m.sets_p1;
    st[m.winner_id].w++; st[m.winner_id === m.player1_id ? m.player2_id : m.player1_id].l++;
  });
  const rows = Object.values(st).sort((a, b) => b.w - a.w || (b.sf - b.sa) - (a.sf - a.sa) || b.sf - a.sf);
  return `<div class="card mb-3"><table class="table mb-0"><thead><tr><th>#</th><th>Atleta</th><th>V</th><th>D</th><th>Sets</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="pos">${i + 1}</td><td>${esc(r.name)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.sf}-${r.sa}</td></tr>`).join('')}</tbody></table></div>`;
}

async function tournamentView(id) {
  const d = await api('/tournaments/' + id), t = d.tournament;
  const ko = t.type === 'knockout';
  const third = ko ? d.matches.find(m => m.third_place) : null;
  let body;
  if (ko) {
    body = `<div class="bracket">${Array.from({ length: d.rounds }, (_, i) => i + 1).map(r => `<div class="bracket-col">
      <div class="text-center text-uppercase small text-secondary fw-bold">${roundLabel(r, d.rounds)}</div>
      ${d.matches.filter(m => m.round === r && !m.third_place).map(m => matchCard(m, id)).join('')}</div>`).join('')}</div>
      ${third ? `<div class="mt-1" style="max-width:320px"><div class="text-uppercase small text-secondary fw-bold mb-1">Disputa de 3º lugar</div>${matchCard(third, id)}</div>` : ''}`;
  } else {
    body = rrTable(d.players, d.matches) + `<div class="row g-2">${d.matches.map(m => `<div class="col-md-6 col-lg-4">${matchCard(m, id)}</div>`).join('')}</div>`;
  }
  const podium = d.standings && ko ? `<div class="card p-3 mb-3"><h5>Classificação final</h5>${d.standings.map(s =>
    `<div>${s.place === 1 ? '🥇' : s.place === 2 ? '🥈' : s.place === 3 ? '🥉' : s.place + 'º'} ${esc(s.name)}</div>`).join('')}</div>` : '';
  render(`<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3"><div>
      <h2 class="ph-title m-0">${esc(t.name)}</h2><div class="text-secondary">${TYPE[t.type]} • melhor de ${t.best_of} • ${t.points_per_set} pts • ${fmtDate(t.date)}${t.location ? ` • <i class="bi bi-geo-alt"></i> ${esc(t.location)}` : ''}${t.type === 'knockout' && t.seeding === 'elo' ? ' • cabeças por ELO' : ''}${third ? ' • com disputa de 3º lugar' : ''}</div></div>
      <div class="d-flex gap-2 align-items-center"><span class="badge ${t.status === 'active' ? 'text-bg-warning' : 'text-bg-success'}">${t.status === 'active' ? 'Em andamento' : 'Finalizado'}</span>
      ${isAdmin() ? `<button id="del" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>` : ''}</div></div>
    ${t.status === 'finished' ? `<div class="alert alert-success">🏆 Campeão: <b>${esc(d.standings[0]?.name || '')}</b></div>` : ''}${podium}${body}`);
  $('#del')?.addEventListener('click', async () => {
    if (!confirm('Excluir este torneio? As partidas jogadas e o ELO permanecem.')) return;
    await api('/tournaments/' + id, { method: 'DELETE' });
    go('#/torneio');
  });
}

function openMatchEditor(m, reload) {
  const competitive = m.mode === 'competitive';
  const originalSeconds = m.duration || 0;
  const initialMinutes = Math.round(originalSeconds / 60);
  const setRow = s => `<div class="set-editor-row">
    <input class="form-control set-a" type="number" inputmode="numeric" min="0" max="99" value="${s && s.length ? s[0] : ''}" aria-label="Pontos do jogador 1">
    <span class="text-secondary">×</span>
    <input class="form-control set-b" type="number" inputmode="numeric" min="0" max="99" value="${s && s.length ? s[1] : ''}" aria-label="Pontos do jogador 2">
    <button type="button" class="btn btn-sm btn-outline-danger" data-remove-set aria-label="Remover set"><i class="bi bi-x-lg"></i></button></div>`;
  const overlay = document.createElement('div');
  overlay.className = 'athlete-sheet';
  overlay.innerHTML = `<div class="athlete-sheet-card" role="dialog" aria-modal="true" aria-label="Corrigir partida">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="m-0">Corrigir partida</h5>
      <button type="button" class="btn btn-sm btn-outline-light" data-close aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="text-secondary small mb-2">${esc(m.player1_name)} <span class="mx-1">vs</span> ${esc(m.player2_name)}${m.tournament_match ? ' · partida de torneio' : ''}</div>
    ${m.tournament_match ? '<div class="alert alert-warning py-2 small">Partidas de torneio não podem ser corrigidas porque alteram a chave.</div>' : ''}
    ${competitive ? `<div class="row g-2 mb-3">
      <div class="col-6"><label class="form-label small mb-1">Pontos por set</label>
        <select id="editPoints" class="form-select">${[3, 5, 7, 9, 11, 15, 21].map(p => `<option ${p === m.points_per_set ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
      <div class="col-6"><label class="form-label small mb-1">Melhor de</label>
        <select id="editBo" class="form-select">${[1, 3, 5, 7].map(p => `<option ${p === m.best_of ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
    </div>
    <label class="form-label small mb-1">Placar dos sets</label>
    <div id="editSets">${(m.sets_json && m.sets_json.length ? m.sets_json : [[null, null], [null, null]]).map(setRow).join('')}</div>
    <button type="button" id="addSet" class="btn btn-sm btn-outline-light mb-3"><i class="bi bi-plus-lg"></i> Adicionar set</button>` : ''}
    <label class="form-label small mb-1">Duração (min)</label>
    <input id="editDuration" type="number" inputmode="numeric" min="0" max="1440" class="form-control mb-2" value="${initialMinutes}">
    <label class="form-label small mb-1">Observações</label>
    <input id="editNotes" class="form-control mb-3" maxlength="200" value="${esc(m.notes || '')}">
    <div class="d-flex gap-2"><button id="saveEdit" class="btn btn-ph btn-go flex-fill" ${m.tournament_match ? 'disabled' : ''}><i class="bi bi-check-lg"></i> Salvar correção</button>
      <button type="button" class="btn btn-outline-secondary" data-close>Cancelar</button></div></div>`;
  document.body.append(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => {
    if (e.target === overlay || e.target.closest('[data-close]')) return close();
    if (e.target.closest('[data-remove-set]')) {
      const rows = $$('.set-editor-row', overlay);
      if (rows.length > 1) e.target.closest('.set-editor-row').remove();
      return;
    }
  });
  $('#addSet', overlay)?.addEventListener('click', () => {
    $('#editSets', overlay).insertAdjacentHTML('beforeend', setRow(null));
  });
  $('#saveEdit', overlay).addEventListener('click', async () => {
    const minutes = +$('#editDuration', overlay).value || 0;
    const body = { duration: minutes === initialMinutes ? originalSeconds : minutes * 60, notes: $('#editNotes', overlay).value };
    if (competitive) {
      const sets = $$('.set-editor-row', overlay).map(row => [
        +$('.set-a', row).value, +$('.set-b', row).value,
      ]).filter(s => s[0] !== 0 || s[1] !== 0);
      if (!sets.length || sets.some(s => !Number.isFinite(s[0]) || !Number.isFinite(s[1]))) return toast('Preencha o placar dos sets.');
      body.points_per_set = +$('#editPoints', overlay).value;
      body.best_of = +$('#editBo', overlay).value;
      body.sets = sets;
    }
    const btn = $('#saveEdit', overlay);
    btn.disabled = true;
    try {
      await api('/matches/' + m.id, { method: 'PUT', body });
      close();
      await reload();
      toast('Partida corrigida e ELO recalculado.', 'success');
    } catch (e) {
      btn.disabled = false;
      toast(e.message);
    }
  });
}

      ${m.mode === 'competitive' && m.elo_p1 == null && m.elo_p2 == null ? '<span class="badge text-bg-secondary">sem ELO</span>' : ''}`;
    const side = (name, win, elo) => `<span class="${win ? 'fw-bold' : ''}">${esc(name)}</span>${elo != null ? ' ' + delta(elo) : ''}`;
    const setsText = m => m.mode === 'cooperative' ? 'Somente tempo' : (m.sets_json || []).map(s => s.join('-')).join(' · ');
    const date = m => new Date(m.created_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    $('#list').innerHTML = `<div class="d-none d-md-block card"><div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th>Data</th><th>Partida</th><th class="text-center">Sets</th><th class="d-none d-lg-table-cell">Placar</th><th class="d-none d-lg-table-cell">Detalhes</th>${admin ? '<th></th>' : ''}</tr></thead><tbody>
      ${data.map(m => `<tr><td class="small text-secondary text-nowrap">${date(m)}</td>
        <td><div>${side(m.player1_name, m.winner === 1, m.elo_p1)}</div>
          <div class="small text-secondary">vs</div><div>${side(m.player2_name, m.winner === 2, m.elo_p2)}</div></td>
        <td class="text-center fw-bold score-tile">${m.mode === 'cooperative' ? `<span class="text-secondary fs-6">${fmtDur(m.duration)}</span>` : `${m.sets_p1} x ${m.sets_p2}`}</td>
        <td class="d-none d-lg-table-cell small text-secondary">${setsText(m)}</td>
        <td class="d-none d-lg-table-cell small">${badges(m)} <span class="text-secondary">${fmtDur(m.duration)}</span>${m.notes ? ` <span class="text-secondary" title="${esc(m.notes)}"><i class="bi bi-chat-left-text"></i></span>` : ''}</td>
        ${admin ? `<td class="text-end">${editBtn(m)}</td>` : ''}</tr>`).join('')}
      </tbody></table></div></div>
      <div class="d-md-none">${data.map(m => `<div class="history-card">
        <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap"><small class="text-secondary">${date(m)}</small>
          <div class="d-flex align-items-center gap-1 flex-wrap justify-content-end ms-auto">${badges(m)}${editBtn(m)}</div></div>
        <div class="d-flex align-items-center gap-2 mt-2">
          <div class="history-side flex-grow-1"><b class="${m.winner === 1 ? 'text-white' : ''}">${esc(m.player1_name)}</b>${m.elo_p1 != null ? delta(m.elo_p1) : ''}</div>
          <div class="history-score">${m.mode === 'cooperative' ? fmtDur(m.duration) : `${m.sets_p1} x ${m.sets_p2}`}</div>
          <div class="history-side text-end flex-grow-1"><b class="${m.winner === 2 ? 'text-white' : ''}">${esc(m.player2_name)}</b>${m.elo_p2 != null ? delta(m.elo_p2) : ''}</div>
        </div>
        <div class="small text-secondary mt-1">${setsText(m)} · ${fmtDur(m.duration)}${m.notes ? ` · ${esc(m.notes)}` : ''}</div></div>`).join('')}</div>`;
    $$('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
      const m = data.find(row => row.id == btn.dataset.edit);
      if (m) openMatchEditor(m, load);
    }));
  };
  $('#q').addEventListener('input', debounce(load));
  await load();
};

PH.routes.mesa = async () => {
  render(`<h2 class="ph-title mb-3">Mesa</h2><div class="row g-3"><div class="col-lg-6"><div id="state" class="card p-4 mb-3"></div>
    <div class="card p-3"><label class="form-label">Seu nome</label><input id="who" class="form-control mb-2" maxlength="100">
    <div class="d-flex gap-2 flex-wrap"><input id="min" type="number" min="1" max="120" value="15" class="form-control" style="width:90px" title="Minutos">
    <button id="occupy" class="btn btn-ph btn-go">Ocupar mesa</button><button id="join" class="btn btn-outline-light">Entrar na fila</button></div></div></div>
    <div class="col-lg-6"><div class="card p-3"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="m-0">Fila</h5>
    <button id="next" class="btn btn-outline-info btn-sm">Chamar próximo</button></div><div id="queue"></div></div></div></div>`);
  $('#who').value = localStorage.getItem('ph_name') || '';
  let st = null, left = 0;
  const draw = () => {
    $('#state').innerHTML = st.occupied
      ? `<div class="status-busy"><i class="dot"></i> Ocupada</div><div class="fs-4">${esc(st.occupied_by)}</div>
         <div class="display-5 fw-bold" id="left">${fmtDur(left)}</div><button id="release" class="btn btn-outline-light mt-2 align-self-start">Liberar mesa</button>`
      : '<div class="status-free"><i class="dot"></i> Mesa livre</div>';
    $('#queue').innerHTML = st.queue.map((p, i) => `<div class="d-flex justify-content-between align-items-center py-1 ${i === 0 ? 'fw-bold text-info' : ''}">
      <span>${i + 1}. ${esc(p.name)} ${i === 0 ? '<span class="badge text-bg-info">próximo</span>' : ''}</span>
      <button class="btn btn-sm btn-outline-danger" data-leave="${p.id}"><i class="bi bi-x"></i></button></div>`).join('') || '<span class="text-secondary">Fila vazia.</span>';
  };
  const load = async () => { st = await api('/mesa'); left = st.remaining_seconds || 0; draw(); };
  const act = async (path, body, method = 'POST') => {
    try { st = await api(path, { method, body }); left = st.remaining_seconds || 0; draw(); } catch (e) { toast(e.message); }
  };
  const name = () => { const n = $('#who').value.trim(); localStorage.setItem('ph_name', n); return n; };
  $('#occupy').addEventListener('click', () => act('/mesa/occupy', { name: name(), minutes: +$('#min').value }));
  $('#join').addEventListener('click', () => act('/mesa/queue', { name: name() }));
  $('#next').addEventListener('click', () => act('/mesa/next', {}));
  $('#state').addEventListener('click', e => { if (e.target.closest('#release')) act('/mesa/release', {}); });
  $('#queue').addEventListener('click', e => {
    const l = e.target.closest('[data-leave]'); if (l) act('/mesa/queue/' + l.dataset.leave, undefined, 'DELETE');
  });
  const poll = setInterval(load, 5000);
  const clock = setInterval(() => {                       // contagem regressiva local entre as atualizações
    if (st?.occupied && left > 0) { left--; const el = $('#left'); if (el) el.textContent = fmtDur(left); if (left === 0) beep(); }
  }, 1000);
  PH.cleanup = () => { clearInterval(poll); clearInterval(clock); };
  await load();
};

  </script>
</body>
