<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c13">
  <title>PingHub — Tênis de Mesa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* ===== PALETA ===== grafite profundo + azul (ações) + verde (positivo/confirmar) + vermelho (negativo) + laranja "bolinha" */
:root, [data-bs-theme=dark] {
  --bg:#090c13; --bg2:#0d121c; --surface:#121826; --surface2:#182033; --line:#222b3f; --line2:#2f3a56;
  --text:#ffffff; --muted:#aab5cb;
  --accent:#3b82f6; --accent2:#7cb4ff; --blue:#3b82f6; --ok:#22c55e; --bad:#f45b69; --warn:#f5b73b;
  --p1:#2563eb; --p2:#ea580c;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --bs-body-bg:var(--bg); --bs-body-color:var(--text); --bs-body-font-family:var(--font-body);
  --bs-border-color:var(--line); --bs-secondary-color:var(--muted); --bs-secondary-rgb:170,181,203;
  --bs-info-rgb:96,165,250; --bs-success-rgb:34,197,94; --bs-danger-rgb:244,91,105; --bs-warning-rgb:245,183,59;
  --bs-link-color-rgb:124,180,255; --bs-link-hover-color-rgb:168,203,255;
}
body { min-height:100vh; background:var(--bg); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
h1,h2,h3,h4,h5,.ph-title { font-family:var(--font-display); font-weight:700; letter-spacing:-.015em; }
h5 { font-size:1.05rem; }
.eyebrow { display:inline-block; font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent2); font-weight:600; margin-bottom:.7rem; }

/* ===== FUNDO ANIMADO ===== */
.bg-fx { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.bg-fx::before, .bg-fx::after { content:""; position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(90px); will-change:transform; }
.bg-fx::before { background:radial-gradient(circle,#1d4ed8,transparent 65%); top:-28vmax; right:-18vmax; opacity:.16; animation:drift1 28s ease-in-out infinite alternate; }
.bg-fx::after  { background:radial-gradient(circle,#16a34a,transparent 65%); bottom:-34vmax; left:-22vmax; opacity:.09; animation:drift2 34s ease-in-out infinite alternate; }
body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.14;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px; -webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%); mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%); }

/* ===== NAVEGAÇÃO ===== */
.ph-nav { background:rgba(9,12,19,.74); backdrop-filter:blur(14px) saturate(140%); border-bottom:1px solid var(--line); animation:navDrop .8s var(--ease) both; }
.ph-nav::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--accent),var(--ok),transparent); background-size:200% 100%; animation:slide 8s linear infinite; opacity:.35; }
.ph-logo { font-family:var(--font-display); font-weight:700; letter-spacing:.12em; color:var(--text); }
.ph-logo i { color:#fb923c; font-size:.7em; display:inline-block; animation:logoPulse 5s ease-in-out infinite; }
.ph-logo span { color:var(--accent); }
.ph-nav .nav-link { position:relative; color:var(--muted); font-size:.86rem; transition:color .3s; }
.ph-nav .nav-link::after { content:""; position:absolute; left:.75rem; right:.75rem; bottom:.2rem; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transform:scaleX(0); transition:transform .45s var(--ease); }
.ph-nav .nav-link:hover { color:var(--text); }
.ph-nav .nav-link:hover::after, .ph-nav .nav-link.active::after { transform:scaleX(1); }
.ph-nav .nav-link.active { color:var(--text) !important; }
.navbar-toggler { border-color:var(--line2); }

/* ===== CARDS (com brilho que segue o cursor) ===== */
.card { position:relative; overflow:hidden; background:linear-gradient(180deg,var(--surface),var(--bg2)); border:1px solid var(--line); border-radius:16px;
  transition:border-color .4s, box-shadow .4s, transform .45s var(--ease); }
.card::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(59,130,246,.06),transparent 60%); }
.card:hover::before { opacity:1; }
.card:hover { border-color:var(--line2); }
.card.clickable, .clickable { cursor:pointer; }
.card.clickable:hover { transform:translateY(-3px); border-color:rgba(59,130,246,.45); box-shadow:0 12px 24px -16px rgba(0,0,0,.7); }
.card.clickable:active { transform:translateY(-1px) scale(.997); }
.ph-title { display:flex; align-items:center; gap:.7rem; }
.ph-title::before { content:""; width:5px; height:1.1em; border-radius:3px; background:linear-gradient(var(--accent),var(--accent2)); animation:grow .7s var(--ease) both; transform-origin:top; }

/* ===== BOTÕES ===== */
.btn { position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:.45rem; border-radius:10px; font-weight:600;
  transition:transform .3s, box-shadow .4s, background-color .3s, border-color .3s, color .3s; }
.btn:active { transform:scale(.985); }
.btn-ph { border:0; color:#fff; background:linear-gradient(135deg,#2563eb,#3b82f6); box-shadow:0 4px 12px -6px rgba(59,130,246,.7); }
.btn-ph::before { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%); transform:translateX(-120%); transition:transform .7s var(--ease); }
.btn-ph:hover { color:#fff; transform:translateY(-1px); box-shadow:0 6px 14px -8px rgba(59,130,246,.55); }
.btn-ph:hover::before { transform:translateX(120%); }
.btn-outline-light { border-color:var(--line2); color:var(--text); }
.btn-outline-light:hover { background:var(--surface2); border-color:var(--muted); color:var(--text); }
.btn-outline-info { --bs-btn-color:var(--accent2); --bs-btn-border-color:rgba(59,130,246,.55); --bs-btn-hover-bg:var(--accent); --bs-btn-hover-border-color:var(--accent); --bs-btn-hover-color:#fff; }
.btn-go { background:linear-gradient(135deg,#15803d,#16a34a); box-shadow:0 4px 12px -6px rgba(34,197,94,.7); }
.btn-go:hover { box-shadow:0 6px 16px -8px rgba(34,197,94,.8); }
.btn:focus-visible, .seg-btn:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
.btn-light { background:#fff; color:#10131c; border:0; }
.ph-ripple { position:absolute; border-radius:50%; pointer-events:none; background:rgba(255,255,255,.25); transform:scale(0); animation:ripple .8s ease-out forwards; }
.bi { display:inline-block; transition:transform .45s var(--ease); }
.btn:hover .bi-plus-lg, .btn:hover .bi-x, .btn:hover .bi-x-lg { transform:rotate(90deg); }
.btn:hover .bi-play-fill { transform:translateX(2px) scale(1.12); }
.btn:hover .bi-arrow-counterclockwise { transform:rotate(-90deg); }

/* ===== FORMULÁRIOS, TABELAS, BADGES ===== */
.form-control, .form-select { background-color:var(--bg2); border-color:var(--line); border-radius:10px; transition:border-color .3s, box-shadow .3s; }
.form-control:focus, .form-select:focus { background-color:var(--bg2); border-color:var(--accent); box-shadow:0 0 0 .2rem rgba(59,130,246,.15); }
.form-check-input:checked { background-color:var(--accent); border-color:var(--accent); }
.table { --bs-table-bg:transparent; --bs-table-border-color:var(--line); --bs-table-hover-bg:rgba(59,130,246,.05); }
.table thead th { font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; border-bottom-color:var(--line2); }
.table tbody tr { transition:background-color .3s; animation:fadeIn .5s ease both; }
.table tbody tr:hover { background:rgba(59,130,246,.05); }
.table tbody tr:nth-child(2){animation-delay:.04s} .table tbody tr:nth-child(3){animation-delay:.08s} .table tbody tr:nth-child(4){animation-delay:.12s}
.table tbody tr:nth-child(5){animation-delay:.16s} .table tbody tr:nth-child(n+6){animation-delay:.2s}
tr.clickable { cursor:pointer; }
.badge { font-weight:600; letter-spacing:.02em; border-radius:999px; padding:.42em .8em; }
.badge.text-bg-info    { background:rgba(59,130,246,.14) !important; color:var(--accent2) !important; border:1px solid rgba(59,130,246,.32); }
.badge.text-bg-secondary { background:var(--surface2) !important; color:var(--muted) !important; border:1px solid var(--line2); }
.badge.text-bg-warning { background:rgba(245,183,59,.13) !important; color:var(--warn) !important; border:1px solid rgba(245,183,59,.3); }
.badge.text-bg-success { background:rgba(34,197,94,.13) !important; color:var(--ok) !important; border:1px solid rgba(34,197,94,.3); }
.alert-success { background:rgba(34,197,94,.1); border-color:rgba(34,197,94,.3); color:var(--ok); }
.alert-danger  { background:rgba(244,91,105,.1);  border-color:rgba(244,91,105,.3);  color:var(--bad); }
.toast { border-radius:12px; backdrop-filter:blur(8px); }
.accordion { --bs-accordion-bg:var(--surface); --bs-accordion-border-color:var(--line); --bs-accordion-btn-bg:var(--surface); --bs-accordion-active-bg:var(--surface2);
  --bs-accordion-active-color:var(--text); --bs-accordion-btn-color:var(--text); --bs-accordion-btn-focus-box-shadow:none; }
.nav-pills .nav-link { color:var(--muted); border-radius:999px; }
.nav-pills .nav-link.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#ffffff; font-weight:600; }
.up { color:var(--ok); } .down { color:var(--bad); }
.text-info { color:var(--accent2) !important; }

/* ===== HERO ===== */
.hero { position:relative; overflow:hidden; border-radius:22px; border:1px solid var(--line2);
  background:linear-gradient(120deg,#0b1a3a,#0f2c5c 45%,#0b4a4a 78%,#0d5c45); background-size:300% 300%; animation:gradientShift 22s ease infinite;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7); min-height:260px; }
.hero::before { content:""; position:absolute; inset:0; opacity:.18; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px); background-size:40px 40px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 90%); mask-image:linear-gradient(90deg,transparent,#000 90%); }
.hero > * { position:relative; z-index:1; }
.hero h1 { font-weight:700; max-width:16ch; letter-spacing:-.025em; }
.hero .lead { color:rgba(255,255,255,.75); max-width:46ch; }
.ball { position:absolute !important; right:10%; top:12%; z-index:0 !important; width:48px; height:48px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff3e0,#ffb15c 38%,#f97316 78%); box-shadow:0 6px 16px rgba(0,0,0,.35); animation:bounce 2.8s infinite; }
.ball-shadow { position:absolute !important; right:calc(10% - 4px); bottom:12%; z-index:0 !important; width:56px; height:10px; border-radius:50%; background:rgba(0,0,0,.5); filter:blur(5px); animation:shadow 2.8s infinite; }
@media (max-width:576px){ .ball,.ball-shadow{ opacity:.45; right:6%; } }

/* ===== ATLETAS / RANKING ===== */
.avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; flex:none; display:inline-flex; align-items:center; justify-content:center; font-weight:700;
  background:linear-gradient(135deg,#25324f,#18213a); color:var(--accent2); border:1px solid var(--line2); transition:transform .5s var(--ease), box-shadow .5s; }
.avatar-lg { width:110px; height:110px; font-size:2.5rem; }
a:hover .avatar, .clickable:hover .avatar { transform:scale(1.06); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
.pos { width:2.2rem; font-family:var(--font-display); font-weight:700; color:var(--muted); }
.pos-1 { color:#ffd166; } .pos-2 { color:#cfd8e6; } .pos-3 { color:#e29b62; }
.elo-big { font-family:var(--font-display); background:linear-gradient(135deg,#7cb4ff,#34d399); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ph-medal { display:inline-flex; align-items:center; gap:.25rem; white-space:nowrap; line-height:1; transition:transform .35s var(--ease); }
.ph-medal:hover { transform:translateY(-2px) scale(1.08); }

/* ===== GRÁFICO DE ELO ===== */
.ph-chart-wrap { overflow-x:auto; }
.ph-chart { display:block; width:100%; min-width:440px; max-width:820px; height:auto; margin:0 auto; }
.ph-chart-grid { stroke:rgba(255,255,255,.07); }
.ph-chart-axis { fill:var(--muted); font-size:11px; font-weight:600; }
.ph-seg { fill:none; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 1; stroke-dashoffset:1; animation:draw .5s var(--ease) forwards; }
.ph-legend { display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; align-items:center; font-size:.8rem; font-weight:600; margin-top:.6rem; }
.ph-chart path { opacity:0; animation:fadeIn 1s 1s forwards; }
.ph-chart-dot { opacity:0; cursor:pointer; animation:fadeIn .5s 1.2s forwards; transition:r .2s; }
.ph-point { cursor:pointer; outline:none; }
.ph-point.hover .ph-chart-dot, .ph-point:focus-visible .ph-chart-dot { r:5; }
.ph-point:focus-visible .ph-chart-dot { stroke:#fff; stroke-width:2; }
.ph-chart-value { fill:#e7edf9; font-size:10px; font-weight:700; paint-order:stroke; stroke:#090c13; stroke-width:3px;
  stroke-linejoin:round; pointer-events:none; opacity:0; transition:opacity .15s ease; }
.ph-point.hover .ph-chart-value, .ph-point:focus .ph-chart-value, .ph-point.active .ph-chart-value { opacity:1; }
/* enquanto um ponto está sob o mouse, o valor fixado por clique não aparece junto */
.ph-chart.has-hover .ph-point.active:not(.hover) .ph-chart-value,
.ph-chart.has-hover .ph-point:focus:not(.hover) .ph-chart-value { opacity:0; }

/* ===== v4: gráfico interativo + comparativo ===== */
.elo-toolbar { display:flex; flex-wrap:wrap; gap:.55rem; align-items:center; justify-content:space-between; margin-bottom:.6rem; }
.elo-periods { display:inline-flex; gap:.2rem; padding:.18rem; border:1px solid var(--line); border-radius:999px; background:var(--bg2); }
.elo-pill { border:0; background:transparent; color:var(--muted); font-size:.76rem; font-weight:600; padding:.34rem .68rem; border-radius:999px; transition:background .25s, color .25s; }
.elo-pill:hover { color:var(--text); }
.elo-pill.active { background:linear-gradient(135deg,#2563eb,#3b82f6); color:#fff; }
.elo-zoombar { display:flex; gap:.3rem; }
.elo-zoombar .btn { padding:.28rem .5rem; }
.elo-chart-wrap { position:relative; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; border-radius:14px; }
.elo-svg { width:100%; min-width:0; height:auto; max-width:none; margin:0; touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none; }
.elo-svg:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
.elo-explorer.dragging .elo-svg { cursor:grabbing; }
.elo-svg path, .elo-svg .ph-chart-dot { opacity:1; animation:none; }
.elo-seg { fill:none; stroke-width:3; stroke-linecap:round; }
.elo-line { fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.elo-crosshair { stroke:rgba(255,255,255,.38); stroke-width:1; stroke-dasharray:4 4; pointer-events:none; }
.elo-svg .ph-point.near .ph-chart-dot { r:5.5; stroke:#fff; stroke-width:2; }
.elo-svg .ph-point:focus-visible .ph-chart-dot { stroke:#fff; stroke-width:2; }
.elo-selected-ring { fill:none; stroke:#fff; stroke-width:2; opacity:.9; pointer-events:none; }
.elo-tip { position:fixed; z-index:1080; width:max-content; max-width:min(300px,calc(100vw - 24px)); padding:.65rem .8rem; border-radius:12px;
  border:1px solid var(--line2); background:rgba(13,18,28,.97); box-shadow:0 18px 40px -18px #000; backdrop-filter:blur(8px);
  pointer-events:none; font-size:.8rem; line-height:1.35; }
.elo-tip .badge { font-size:.62rem; }
.elo-legend { display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; align-items:center; font-size:.8rem; font-weight:600; margin-top:.65rem; }
.elo-legend .pdot { width:.6rem; height:.6rem; margin-right:.35rem; }
.elo-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(102px,1fr)); gap:.5rem; margin-top:.65rem; }
.elo-stat { padding:.55rem .65rem; border:1px solid var(--line); border-radius:10px; background:var(--bg2); min-width:0; }
.elo-stat span { display:block; color:var(--muted); font-size:.64rem; letter-spacing:.05em; text-transform:uppercase; }
.elo-stat b { font-family:var(--font-display); font-size:1.05rem; }
.elo-summary-compare { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:.5rem; grid-column:1 / -1; }
.elo-summary-card { border:1px solid var(--line); border-radius:12px; background:var(--bg2); padding:.6rem .7rem; }
.elo-summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.35rem; margin-top:.45rem; }
.elo-summary-grid span { display:block; color:var(--muted); font-size:.6rem; text-transform:uppercase; letter-spacing:.04em; }
.elo-summary-grid b { font-size:.88rem; }
.elo-detail { margin-top:.65rem; }
.elo-detail-card { border:1px solid var(--line2); border-radius:14px; background:linear-gradient(180deg,var(--surface2),var(--bg2)); padding:.85rem; animation:fadeIn .25s ease both; }
.elo-detail-card .elo-score { font-family:var(--font-display); font-size:1.6rem; font-weight:700; line-height:1; }
.elo-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.5rem; margin-top:.6rem; }
.elo-detail-grid > div { padding:.45rem .55rem; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.015); }
.elo-detail-grid small { display:block; color:var(--muted); font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; }
.elo-hint { margin-top:.55rem; color:var(--muted); font-size:.76rem; }
.elo-explorer.compare .elo-summary { grid-template-columns:1fr; }

.cmp-duel { display:grid; grid-template-columns:1fr auto 1fr; gap:.75rem; align-items:stretch; margin-bottom:1rem; }
.cmp-side { --cmp:var(--p1); position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:1rem;
  border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,var(--surface),var(--bg2)); text-decoration:none; color:var(--text);
  transition:border-color .3s, transform .3s; overflow:hidden; }
.cmp-side::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--cmp); }
.cmp-side:hover { border-color:var(--cmp); transform:translateY(-2px); color:var(--text); }
.cmp-side.b { --cmp:var(--p2); }
.cmp-side .avatar { width:64px; height:64px; font-size:1.5rem; }
.cmp-side .cmp-name { font-family:var(--font-display); font-size:1.1rem; font-weight:700; margin-top:.5rem; }
.cmp-side .cmp-nick { color:var(--muted); font-size:.78rem; }
.cmp-side .cmp-elo { font-family:var(--font-display); font-size:2.1rem; font-weight:700; line-height:1.05; color:var(--cmp); margin-top:.35rem; }
.cmp-side .cmp-sub { color:var(--muted); font-size:.78rem; }
.cmp-vs { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-width:140px; padding:.75rem;
  border:1px solid var(--line); border-radius:16px; background:var(--bg2); }
.cmp-vs-score { font-family:var(--font-display); font-size:2rem; font-weight:700; display:flex; gap:.5rem; align-items:baseline; line-height:1; }
.cmp-vs-score .a { color:var(--cmp-a,var(--accent2)); } .cmp-vs-score .b { color:#ffb27a; }
.cmp-form { display:flex; gap:.25rem; margin-top:.5rem; justify-content:center; }
.cmp-form span { width:1.35rem; height:1.35rem; display:grid; place-items:center; border-radius:50%; font-size:.63rem; font-weight:700;
  border:1px solid var(--line2); color:var(--muted); background:var(--surface2); }
.cmp-form span.w { background:rgba(34,197,94,.16); border-color:rgba(34,197,94,.45); color:var(--ok); }
.cmp-form span.l { background:rgba(244,91,105,.14); border-color:rgba(244,91,105,.4); color:var(--bad); }
.cmp-metric { padding:.55rem .15rem; border-bottom:1px solid var(--line); }
.cmp-metric:last-child { border-bottom:0; }
.cmp-metric-head { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem; }
.cmp-metric-head .cmp-value { font-family:var(--font-display); font-size:1rem; font-weight:700; }
.cmp-metric-head .cmp-value.a { text-align:right; }
.cmp-metric-head .cmp-value.b { text-align:left; }
.cmp-metric-head .cmp-value.lead-a { color:var(--accent2); }
.cmp-metric-head .cmp-value.lead-b { color:#ffb27a; }

  <script>
/* PingHub — núcleo do frontend: roteador por hash, chamadas à API e utilitários. */
const PH = { routes: {}, cleanup: null };
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

const ADMIN_KEY = 'ph_admin_token';
const adminToken = () => localStorage.getItem(ADMIN_KEY) || '';
const isAdmin = () => !!adminToken();

async function api(path, { method = 'GET', body } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const token = adminToken();
  if (token) headers['X-Admin-Token'] = token;
  const r = await fetch('/api' + path, {
    method, headers,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && token) localStorage.removeItem(ADMIN_KEY);
    throw new Error(data.error || 'Erro ' + r.status);
  }
  return data;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') : '';
const fmtDur = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const delta = n => n > 0 ? `<span class="up">▲ ${n}</span>` : n < 0 ? `<span class="down">▼ ${-n}</span>` : '<span class="text-secondary">–</span>';
const LEVEL = { iniciante: 'Iniciante', intermediario: 'Intermediário', avancado: 'Avançado' };
const HAND = { destro: 'Destro', canhoto: 'Canhoto' };
const STYLE = { caneta: 'Caneta', classineta: 'Classineta', classica: 'Clássica' };
const GAME_STYLE = { ataque: 'Ataque', contra_ataque: 'Contra-ataque', defesa: 'Defesa' };

function avatar(a, big = false) {
  const cls = 'avatar' + (big ? ' avatar-lg' : '');
  if (a.has_photo) return `<img class="${cls}" src="/api/athletes/${a.id}/photo" alt="">`;
  return `<span class="${cls}">${esc((a.name || '?').trim()[0].toUpperCase())}</span>`;
}

function toast(msg, kind = 'danger') {
  const el = document.createElement('div');
  el.className = `toast align-items-center text-bg-${kind} border-0`;
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${esc(msg)}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  $('#toasts').append(el);
  const t = new bootstrap.Toast(el, { delay: 4000 });
  t.show();
  el.addEventListener('hidden.bs.toast', () => el.remove());
}

const render = html => {

/* ripple nos botões (interatividade) */
document.addEventListener('click', e => {
  const btn = e.target.closest?.('.btn');
  if (!btn || btn.disabled || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.8;
  const x = e.detail ? e.clientX : r.left + r.width / 2;
  const y = e.detail ? e.clientY : r.top + r.height / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ph-ripple';
  ripple.style.width = ripple.style.height = `${size}px`;
  ripple.style.left = `${x - r.left - size / 2}px`;
  ripple.style.top = `${y - r.top - size / 2}px`;
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
});

/* brilho que segue o cursor nos cards */
document.addEventListener('pointermove', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

/* botões principais "atraídos" pelo cursor */
document.addEventListener('pointermove', e => {
  const b = e.target.closest?.('.btn-ph:not(.pt-btn)'); if (!b || b.classList.contains('btn-lg')) return;
  const r = b.getBoundingClientRect();
  b.style.setProperty('--tx', ((e.clientX - r.left - r.width / 2) * .12).toFixed(1) + 'px');
  b.style.setProperty('--ty', ((e.clientY - r.top - r.height / 2) * .22).toFixed(1) + 'px');
}, { passive: true });
document.addEventListener('pointerout', e => {
  const b = e.target.closest?.('.btn-ph'); if (b) { b.style.removeProperty('--tx'); b.style.removeProperty('--ty'); }
});

/* números que sobem até o valor final */
function countUps(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-count]', root).forEach(el => {
    const to = +el.dataset.count, from = Math.round(to * .85), t0 = performance.now();
    const step = t => { const k = Math.min((t - t0) / 900, 1); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 600);
  } catch (e) { /* sem áudio */ }
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}

async function route() {
  const [name, ...args] = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/');
  $$('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.r === name));
  if (PH.cleanup) { PH.cleanup(); PH.cleanup = null; }
  const view = PH.routes[name];
  if (!view) return render('<h2>Página não encontrada</h2>');
  loading();
  window.scrollTo(0, 0);
  try { await view(...args); }
  catch (e) { render(`<div class="alert alert-danger">${esc(e.message)}</div>`); }
}

// navega para uma rota; se já estiver nela, força a renderização (botões "Nova partida", cancelar etc.)
function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

/* Atletas: lista, formulário (novo/editar) e perfil com gráfico de ELO. */
function resizeImage(file, size = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('Imagem inválida.'));
    img.src = URL.createObjectURL(file);
  });
}

/* ===== Gráfico de ELO interativo =====
   SVG desenhado sob demanda com janela de tempo (zoom/pan), tooltip por ponto,
   filtros de período e painel com o detalhe completo da partida selecionada. */
const ELO_GEO = { W: 920, H: 320, L: 54, R: 22, T: 22, B: 42 };
const ELO_PW = ELO_GEO.W - ELO_GEO.L - ELO_GEO.R;
const ELO_PH = ELO_GEO.H - ELO_GEO.T - ELO_GEO.B;

// Em telas estreitas o SVG usa a largura real do card, para o gráfico inteiro caber
// sem rolagem horizontal e sem encolher os rótulos dos eixos.
function eloGeoFor(root) {
  const width = Math.round(root?.clientWidth || 0);
  if (width >= 680) return { ...ELO_GEO, PW: ELO_PW, PH: ELO_PH };
  const W = Math.max(280, width || 320), H = 300, L = 42, R = 16, T = 18, B = 44;
  return { W, H, L, R, T, B, PW: W - L - R, PH: H - T - B };
}
const ELO_UP = '#22c55e', ELO_DOWN = '#f45b69', ELO_FLAT = '#94a3b8';
const ELO_COLORS = ['#60a5fa', '#fb923c'];
let ELO_CHART_UID = 0;

const eloColor = d => d > 0 ? ELO_UP : d < 0 ? ELO_DOWN : ELO_FLAT;
const eloWhen = at => new Date(at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const signedPts = n => n > 0 ? `+${n}` : String(n);

function eloPoints(entries) {
  return [...(entries || [])].map(h => ({
    at: new Date(h.created_at).getTime(),
    value: Number(h.elo_after),
    delta: Number(h.delta) || 0,
    meta: h,
  })).filter(p => Number.isFinite(p.at) && Number.isFinite(p.value))
    .sort((a, b) => a.at - b.at);
}

function eloWithInitial(points) {
  if (!points.length) return [];
  return [{ at: points[0].at - 60_000, value: 1000, delta: 0, meta: null, initial: true }, ...points];
}

// shell do gráfico: tanto o perfil (1 série) quanto o comparativo (2 séries) usam o mesmo componente
function eloChart(history) {
  if (!eloPoints(history).length) return '<p class="text-secondary mb-0">Sem partidas ranqueadas ainda.</p>';
  return eloChartShell({});
}

function eloChartShell(opts = {}) {
  const compare = !!opts.compare;
  const legend = opts.legend || `<span class="up">● Subiu</span><span class="down">● Caiu</span>
    <span class="text-secondary">● Sem alteração</span><span class="ms-auto" data-net></span>`;
  return `<div class="elo-explorer${compare ? ' compare' : ''}">
    <div class="elo-toolbar">
      <div class="elo-periods" role="group" aria-label="Período do gráfico">
        ${[['30', '30d'], ['90', '90d'], ['365', '1 ano'], ['all', 'Tudo']].map(([v, label]) =>
          `<button type="button" class="elo-pill${v === 'all' ? ' active' : ''}" data-period="${v}">${label}</button>`).join('')}
      </div>
      <div class="elo-zoombar">
        <button type="button" class="btn btn-sm btn-outline-light" data-zoom="out" aria-label="Diminuir zoom" title="Diminuir zoom"><i class="bi bi-zoom-out"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light" data-zoom="reset" aria-label="Restaurar visão" title="Restaurar visão"><i class="bi bi-arrows-fullscreen"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light" data-zoom="in" aria-label="Aumentar zoom" title="Aumentar zoom"><i class="bi bi-zoom-in"></i></button>
      </div>
    </div>
    <div class="elo-chart-wrap">
      <svg class="ph-chart elo-svg" viewBox="0 0 ${ELO_GEO.W} ${ELO_GEO.H}" tabindex="0" role="img"
        aria-label="${compare ? 'Comparação da evolução do ELO dos atletas' : 'Evolução cronológica do ELO'}" data-chart-svg></svg>
    </div>
    <div class="elo-tip" data-tip role="status" aria-live="polite" hidden></div>
    <div class="elo-legend" data-legend>${legend}</div>
    <div class="elo-summary" data-summary></div>
    <div class="elo-detail" data-detail hidden></div>
    <div class="elo-hint"><i class="bi bi-hand-index-thumb"></i> Arraste para navegar · roda do mouse ou +/− para zoom · duplo clique restaura · clique num ponto para ver a partida.</div>
  </div>`;
}

function eloLowerBound(points, at) {
  let lo = 0, hi = points.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (points[mid].at < at) lo = mid + 1; else hi = mid; }
  return lo;
}

function eloNearest(points, at) {
  if (!points.length) return -1;
  const i = eloLowerBound(points, at);
  if (i <= 0) return 0;
  if (i >= points.length) return points.length - 1;
  return Math.abs(points[i - 1].at - at) <= Math.abs(points[i].at - at) ? i - 1 : i;
}

function eloNiceStep(span) {
  if (!(span > 0)) return 1;
  const pow = 10 ** Math.floor(Math.log10(span));
  const norm = span / pow;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * pow;
}

function eloChartTick(ms, span) {
  const d = new Date(ms);
  if (span >= 300 * 864e5) return d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
  if (span >= 2 * 864e5) return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  if (span >= 3 * 3600e3) return `${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
  if (span >= 60e3) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function eloPointTooltip(series, point) {
  if (point.initial) {
    return `<div class="small text-secondary mb-1">${eloWhen(point.at)}</div>
      <div class="fw-semibold">ELO inicial</div><div class="fs-5 fw-bold">1000</div>`;
  }
  const m = point.meta || {};
  const badge = m.result === 'W' ? '<span class="badge text-bg-success">Vitória</span>'
    : m.result === 'L' ? '<span class="badge text-bg-danger">Derrota</span>' : '<span class="badge text-bg-secondary">Partida</span>';
  const score = m.sets?.length ? m.sets.map(s => s.join('-')).join(' · ') : '';
  return `<div class="d-flex align-items-center justify-content-between gap-2 mb-1">${badge}
      <small class="text-secondary">${eloWhen(point.at)}</small></div>
    <div class="fw-semibold mb-1">vs ${esc(m.opponent || '—')}</div>
    <div class="small mb-1">${m.sets_me ?? '—'} × ${m.sets_opp ?? '—'}${score ? ` <span class="text-secondary">(${score})</span>` : ''}</div>
    <div class="small">ELO ${point.value - point.delta} → <b>${point.value}</b> ${delta(point.delta)}</div>
    ${m.tournament ? `<div class="small text-secondary mt-1"><i class="bi bi-trophy"></i> ${esc(m.tournament)}</div>` : ''}`;
}

function eloCompareTooltip(series, at) {
  const date = eloWhen(at);
  const rows = series.map(s => {
    const idx = eloNearest(s.points, at);
    if (idx < 0) return '';
    const p = s.points[idx];
    return `<div class="d-flex align-items-center gap-2 py-1"><span class="pdot" style="background:${s.color}"></span>
      <span class="flex-grow-1 text-truncate">${esc(s.name)}</span><b>${p.value}</b>
      <span class="small">${p.initial ? '' : delta(p.delta)}</span></div>`;
  }).join('');
  return `<div class="small text-secondary mb-1">${date}</div>${rows}`;
}

function initEloExplorer(root, series, opts = {}) {
  if (!root) return;
  const svg = $('[data-chart-svg]', root);
  if (!svg) return;
  const tip = $('[data-tip]', root);
  const detail = $('[data-detail]', root);
  const summary = $('[data-summary]', root);
  const single = opts.mode !== 'compare';
  const prepared = series.map((s, i) => ({
    id: s.id ?? String(i), name: s.name || 'Atleta', color: s.color || ELO_COLORS[i % ELO_COLORS.length],
    points: eloWithInitial(eloPoints(s.history)),
  })).filter(s => s.points.length);
  if (!prepared.length) return;

  // geometria responsiva desta instância (sombreia as constantes padrão do desktop)
  const G = eloGeoFor(root);
  const PW = G.PW, PH = G.PH;
  svg.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);

  const allTimes = prepared.flatMap(s => s.points.map(p => p.at));
  const dataStart = Math.min(...allTimes), dataEnd = Math.max(...allTimes);
  const dataSpan = Math.max(dataEnd - dataStart, 60_000);
  const edge = Math.max(60_000, dataSpan * .015);
  const fullStart = dataStart - edge, fullEnd = dataEnd + edge;
  const state = {
    period: 'all', domainStart: fullStart, domainEnd: fullEnd,
    viewStart: fullStart, viewEnd: fullEnd, selected: null, dragging: null,
    minSpan: Math.max(5_000, dataSpan / 1000),
  };
  const uid = 'eloClip' + (++ELO_CHART_UID);
  const span = () => Math.max(state.viewEnd - state.viewStart, 1);
  const xAt = at => G.L + (at - state.viewStart) / span() * PW;
  const inView = p => p.at >= state.viewStart && p.at <= state.viewEnd;
  const timeAtX = clientX => {
    const rect = svg.getBoundingClientRect();
    const vx = (clientX - rect.left) * G.W / (rect.width || 1);
    return state.viewStart + Math.max(0, Math.min(1, (vx - G.L) / PW)) * span();
  };
  const pathPoints = points => {
    let from = eloLowerBound(points, state.viewStart), to = eloLowerBound(points, state.viewEnd);
    if (from > 0) from--;
    if (to < points.length) to++;
    return points.slice(from, Math.max(to, from + 1));
  };

  function setView(start, end) {
    const domSpan = state.domainEnd - state.domainStart;
    const minSpan = Math.min(state.minSpan, domSpan);
    const spanWanted = Math.min(Math.max(end - start, minSpan), domSpan);
    const mid = (start + end) / 2;
    let ns = mid - spanWanted / 2, ne = mid + spanWanted / 2;
    if (ns < state.domainStart) { ne += state.domainStart - ns; ns = state.domainStart; }
    if (ne > state.domainEnd) { ns -= ne - state.domainEnd; ne = state.domainEnd; }
    state.viewStart = Math.max(state.domainStart, ns);
    state.viewEnd = Math.min(state.domainEnd, ne);
    hideTip();
    draw();
  }

  function zoomAt(factor, at) {
    const s = span();
    const target = Math.max(state.minSpan, Math.min(s * factor, state.domainEnd - state.domainStart));
    const frac = Math.max(0, Math.min(1, (at - state.viewStart) / s));
    setView(at - target * frac, at + target * (1 - frac));
  }

  function resetView() {
    state.selected = null;
    state.viewStart = state.domainStart;
    state.viewEnd = state.domainEnd;
    hideTip();
    draw();
  }

  function applyPeriod(period) {
    state.period = period;
    const days = period === 'all' ? null : Number(period);
    state.domainStart = days ? Math.max(fullStart, dataEnd - days * 864e5) : fullStart;
    state.domainEnd = fullEnd;
    state.viewStart = state.domainStart;
    state.viewEnd = state.domainEnd;
    state.selected = null;
    hideTip();
    draw();
  }

  function updateControls() {
    const s = span(), dom = state.domainEnd - state.domainStart;
    const zin = $('[data-zoom="in"]', root), zout = $('[data-zoom="out"]', root), zreset = $('[data-zoom="reset"]', root);
    if (zin) zin.disabled = s <= Math.min(state.minSpan, dom) + 1;
    if (zout) zout.disabled = s >= dom - 1;
    if (zreset) zreset.disabled = s >= dom - 1;
    $$('[data-period]', root).forEach(b => b.classList.toggle('active', b.dataset.period === state.period));
  }

  function renderSummary() {
    const vals = s => s.points.filter(p => !p.initial && inView(p));
    const lastAt = s => {
      const idx = eloLowerBound(s.points, state.viewEnd + 1) - 1;
      return s.points[Math.max(0, idx)] || null;
    };
    if (single) {
      const pts = vals(prepared[0]);
      const wins = pts.filter(p => p.meta?.result === 'W').length;
      const losses = pts.filter(p => p.meta?.result === 'L').length;
      const net = pts.reduce((sum, p) => sum + p.delta, 0);
      const last = lastAt(prepared[0]);
      const values = pts.map(p => p.value);
      const max = values.length ? Math.max(...values) : null;
      const min = values.length ? Math.min(...values) : null;
      summary.innerHTML = `<div class="elo-stat"><span>Partidas</span><b>${pts.length}</b></div>
        <div class="elo-stat"><span>V / D</span><b>${wins}–${losses}</b></div>
        <div class="elo-stat"><span>Saldo ELO</span><b class="${net > 0 ? 'up' : net < 0 ? 'down' : ''}">${signedPts(net)}</b></div>
        <div class="elo-stat"><span>ELO final</span><b>${last ? last.value : '—'}</b></div>
        <div class="elo-stat"><span>Máx. / Mín.</span><b>${max ?? '—'} / ${min ?? '—'}</b></div>`;
      const netEl = $('[data-net]', root);
      if (netEl) netEl.innerHTML = `<span class="${net > 0 ? 'up' : net < 0 ? 'down' : 'text-secondary'}">Saldo no período: ${signedPts(net)} pts</span>`;
    } else {
      summary.innerHTML = `<div class="elo-summary-compare">${prepared.map(s => {
        const pts = vals(s), wins = pts.filter(p => p.meta?.result === 'W').length;
        const losses = pts.filter(p => p.meta?.result === 'L').length;
        const net = pts.reduce((sum, p) => sum + p.delta, 0);
        const last = lastAt(s);
        return `<div class="elo-summary-card"><div class="d-flex align-items-center gap-2">
          <span class="pdot" style="background:${s.color}"></span><b class="text-truncate">${esc(s.name)}</b>
          <span class="ms-auto fs-5 fw-bold">${last ? last.value : '—'}</span></div>
          <div class="elo-summary-grid">
            <div><span>Partidas</span><b>${pts.length}</b></div>
            <div><span>V / D</span><b>${wins}–${losses}</b></div>
            <div><span>Saldo</span><b class="${net > 0 ? 'up' : net < 0 ? 'down' : ''}">${signedPts(net)}</b></div>
            <div><span>Máx.</span><b>${pts.length ? Math.max(...pts.map(p => p.value)) : '—'}</b></div>
          </div></div>`;
      }).join('')}</div>`;
    }
  }

  function renderDetail() {
    if (!detail) return;
    if (!state.selected) { detail.hidden = true; detail.innerHTML = ''; return; }
    const s = prepared[state.selected.s], p = s.points[state.selected.i];
    if (!p) { detail.hidden = true; return; }
    if (p.initial) {
      detail.innerHTML = `<div class="elo-detail-card"><div class="d-flex justify-content-between gap-2">
        <div><span class="badge text-bg-secondary">Início</span> <small class="text-secondary">${eloWhen(p.at)}</small></div>
        <button class="btn btn-sm btn-outline-light" data-detail-close aria-label="Fechar detalhe"><i class="bi bi-x-lg"></i></button></div>
        <div class="elo-score mt-2">1000</div><div class="small text-secondary">ELO inicial antes da primeira partida ranqueada.</div></div>`;
      detail.hidden = false;
      return;
    }
    const m = p.meta || {};
    const badge = m.result === 'W' ? '<span class="badge text-bg-success">Vitória</span>'
      : m.result === 'L' ? '<span class="badge text-bg-danger">Derrota</span>' : '<span class="badge text-bg-secondary">Partida</span>';
    const opp = m.opponent_id ? `<a href="#/atletas/${m.opponent_id}" class="text-decoration-none">${esc(m.opponent || '—')}</a>` : esc(m.opponent || '—');
    detail.innerHTML = `<div class="elo-detail-card">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div><div class="d-flex align-items-center gap-2 flex-wrap">${badge}<small class="text-secondary">${eloWhen(p.at)}</small></div>
          <h6 class="mt-2 mb-0">vs ${opp}${!single ? ` <span class="badge text-bg-secondary ms-1">${esc(s.name)}</span>` : ''}</h6></div>
        <button class="btn btn-sm btn-outline-light" data-detail-close aria-label="Fechar detalhe"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="d-flex align-items-baseline gap-3 flex-wrap mt-2">
        <div class="elo-score">${m.sets_me ?? '—'} × ${m.sets_opp ?? '—'}</div>
        <div class="small text-secondary">${(m.sets || []).map(x => x.join('-')).join(' · ') || 'Sem sets registrados'}</div>
      </div>
      <div class="elo-detail-grid">
        <div><small>ELO</small><b>${p.value - p.delta} → ${p.value}</b> ${delta(p.delta)}</div>
        <div><small>Set / partida</small><b>${m.points_per_set ?? '—'} pontos · melhor de ${m.best_of ?? '—'}</b></div>
        <div><small>Duração</small><b>${fmtDur(m.duration || 0)}</b></div>
        ${m.tournament ? `<div><small>Torneio</small><b>${esc(m.tournament)}</b></div>` : ''}
      </div>
      ${m.notes ? `<div class="small text-secondary mt-2"><i class="bi bi-chat-left-text"></i> ${esc(m.notes)}</div>` : ''}
    </div>`;
    detail.hidden = false;
  }

  function draw() {
    const s = span();
    const visibleValues = [];
    prepared.forEach(ser => ser.points.forEach(p => { if (inView(p)) visibleValues.push(p.value); }));
    if (!visibleValues.length) {
      const mid = (state.viewStart + state.viewEnd) / 2;
      prepared.forEach(ser => { const i = eloNearest(ser.points, mid); if (i >= 0) visibleValues.push(ser.points[i].value); });
    }
    const rawLo = Math.min(...visibleValues), rawHi = Math.max(...visibleValues);
    const valSpan = Math.max(rawHi - rawLo, 10);
    const padY = Math.max(5, valSpan * .12);
    let stepY = eloNiceStep((valSpan + padY * 2) / 5);
    let yMin = Math.floor((rawLo - padY) / stepY) * stepY;
    let yMax = Math.ceil((rawHi + padY) / stepY) * stepY;
    while ((yMax - yMin) / stepY > 8) { stepY *= 2; yMin = Math.floor((rawLo - padY) / stepY) * stepY; yMax = Math.ceil((rawHi + padY) / stepY) * stepY; }
    if (yMax <= yMin) yMax = yMin + stepY;
    const yAt = v => G.T + (yMax - v) / (yMax - yMin) * PH;

    let grid = '', axis = '';
    for (let v = yMin; v <= yMax + stepY / 2; v += stepY) {
      const yy = yAt(v);
      grid += `<line class="ph-chart-grid" x1="${G.L}" y1="${yy.toFixed(1)}" x2="${G.W - G.R}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
      axis += `<text class="ph-chart-axis" x="${G.L - 8}" y="${(yy + 3.5).toFixed(1)}" text-anchor="end" fill="#8b95b8" font-size="11" font-weight="600">${Math.round(v)}</text>`;
    }
    for (let i = 0; i < 5; i++) {
      const at = state.viewStart + s * i / 4, xx = xAt(at);
      const anchor = i === 0 ? 'start' : i === 4 ? 'end' : 'middle';
      grid += `<line class="ph-chart-grid" x1="${xx.toFixed(1)}" y1="${G.T}" x2="${xx.toFixed(1)}" y2="${G.H - G.B}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
      axis += `<text class="ph-chart-axis" x="${xx.toFixed(1)}" y="${G.H - 10}" text-anchor="${anchor}" fill="#8b95b8" font-size="11" font-weight="600">${eloChartTick(at, s)}</text>`;
    }
    const baseLine = 1000 >= yMin && 1000 <= yMax
      ? `<line x1="${G.L}" y1="${yAt(1000).toFixed(1)}" x2="${G.W - G.R}" y2="${yAt(1000).toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-width="1" stroke-dasharray="4 4"/>` : '';
    const baseLabel = 1000 >= yMin && 1000 <= yMax
      ? `<text x="${G.W - G.R}" y="${(yAt(1000) - 4).toFixed(1)}" text-anchor="end" fill="#aab5cb" font-size="10" font-weight="600"
           paint-order="stroke" stroke="#0d121c" stroke-width="3">ELO inicial 1000</text>` : '';

    let plots = '';
    prepared.forEach((ser, si) => {
      const pts = pathPoints(ser.points);
      if (single) {
        const first = pts[0], last = pts[pts.length - 1];
        const net = last && first ? last.value - first.value : 0;
        const fill = net >= 0 ? ELO_UP : ELO_DOWN;
        if (pts.length > 1) {
          const area = `M ${xAt(first.at).toFixed(1)} ${(G.H - G.B).toFixed(1)} L ` +
            pts.map(p => `${xAt(p.at).toFixed(1)} ${yAt(p.value).toFixed(1)}`).join(' L ') +
            ` L ${xAt(last.at).toFixed(1)} ${(G.H - G.B).toFixed(1)} Z`;
          plots += `<path d="${area}" fill="url(#${uid}fill)"/>`;
          for (let i = 1; i < pts.length; i++) {
            const q = pts[i - 1], p = pts[i];
            plots += `<line class="elo-seg" x1="${xAt(q.at).toFixed(1)}" y1="${yAt(q.value).toFixed(1)}" x2="${xAt(p.at).toFixed(1)}" y2="${yAt(p.value).toFixed(1)}" stroke="${eloColor(p.value - q.value)}"/>`;
          }
        }
      } else if (pts.length > 1) {
        plots += `<path class="elo-line" d="${pts.map((p, i) => `${i ? 'L' : 'M'} ${xAt(p.at).toFixed(1)} ${yAt(p.value).toFixed(1)}`).join(' ')}" stroke="${ser.color}"/>`;
      }
      ser.points.forEach((p, i) => {
        if (!inView(p)) return;
        const last = i === ser.points.length - 1;
        const cx = xAt(p.at), cy = yAt(p.value);
        const fill = single ? (p.initial ? ELO_FLAT : eloColor(p.delta)) : ser.color;
        const aria = p.initial ? `ELO inicial 1000 em ${eloWhen(p.at)}`
          : `${eloWhen(p.at)}: ${p.meta?.result === 'W' ? 'vitória' : 'derrota'} contra ${p.meta?.opponent || 'adversário'}, sets ${p.meta?.sets_me ?? '?'} a ${p.meta?.sets_opp ?? '?'}, ELO ${p.value}`;
        const selected = state.selected && state.selected.s === si && state.selected.i === i;
        plots += `<g class="ph-point${selected ? ' active' : ''}" data-s="${si}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(aria)}">
          <circle class="ph-chart-dot${last ? ' last' : ''}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${last ? 5 : 3}"
            fill="${fill}" stroke="${last ? '#fff' : '#121826'}" stroke-width="${last ? 2 : 1.5}"><title>${esc(aria)}</title></circle>
          ${selected ? `<circle class="elo-selected-ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9"/>` : ''}
        </g>`;
      });
    });

    const mainVisible = prepared[0].points.filter(p => !p.initial && inView(p));
    const mainNet = mainVisible.length > 1 ? mainVisible[mainVisible.length - 1].value - mainVisible[0].value
      : (prepared[0].points[prepared[0].points.length - 1]?.value || 1000) - 1000;
    const fillCol = mainNet >= 0 ? ELO_UP : ELO_DOWN;
    const defs = `<defs><clipPath id="${uid}"><rect x="${G.L}" y="${G.T}" width="${PW}" height="${PH}"/></clipPath>
      <linearGradient id="${uid}fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${single ? fillCol : ELO_COLORS[0]}" stop-opacity=".24"/>
        <stop offset="100%" stop-color="${single ? fillCol : ELO_COLORS[0]}" stop-opacity="0"/>
      </linearGradient></defs>`;
    svg.innerHTML = `${defs}<g clip-path="url(#${uid})">${grid}${baseLine}${plots}</g>${axis}${baseLabel}
      <line class="elo-crosshair" data-crosshair x1="${G.L}" y1="${G.T}" x2="${G.L}" y2="${G.H - G.B}" style="display:none"/>`;
    renderSummary();
    renderDetail();
    updateControls();
  }

  function hideTip() {
    if (tip) tip.hidden = true;
    const cross = $('[data-crosshair]', svg);
    if (cross) cross.style.display = 'none';
    $$('.ph-point.near', svg).forEach(g => g.classList.remove('near'));
  }

  function showTip(clientX, clientY, html) {
    if (!tip) return;
    tip.innerHTML = html;
    tip.hidden = false;
    const box = tip.getBoundingClientRect(), gap = 14;
    let left = clientX + gap, top = clientY + gap;
    if (left + box.width > innerWidth - 8) left = clientX - box.width - gap;
    if (top + box.height > innerHeight - 8) top = clientY - box.height - gap;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = Math.max(8, top) + 'px';
  }

  function handleHover(e) {
    const rect = svg.getBoundingClientRect();
    const vx = (e.clientX - rect.left) * G.W / (rect.width || 1);
    if (vx < G.L || vx > G.W - G.R) return hideTip();
    const at = timeAtX(e.clientX);
    let best = null;
    prepared.forEach((ser, si) => {
      const idx = eloNearest(ser.points, at);
      if (idx < 0) return;
      const p = ser.points[idx];
      if (!inView(p)) return;
      if (!best || Math.abs(p.at - at) < Math.abs(best.p.at - at)) best = { s: ser, si, i: idx, p };
    });
    if (!best) return hideTip();
    const cross = $('[data-crosshair]', svg);
    if (cross) {
      cross.setAttribute('x1', xAt(best.p.at).toFixed(1));
      cross.setAttribute('x2', xAt(best.p.at).toFixed(1));
      cross.style.display = '';
    }
    $$('.ph-point.near', svg).forEach(g => g.classList.remove('near'));
    prepared.forEach((ser, si) => {
      const idx = eloNearest(ser.points, best.p.at), p = ser.points[idx];
      if (!p || !inView(p)) return;
      const g = svg.querySelector(`.ph-point[data-s="${si}"][data-i="${idx}"]`);
      if (g) g.classList.add('near');
    });
    showTip(e.clientX, e.clientY, single ? eloPointTooltip(best.s, best.p) : eloCompareTooltip(prepared, best.p.at));
  }

  function nearestPointFromEvent(e) {
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const px = (e.clientX - rect.left) * G.W / rect.width;
    const py = (e.clientY - rect.top) * G.H / rect.height;
    let best = null, bestD = Infinity;
    $$('.ph-point', svg).forEach(g => {
      const dot = $('.ph-chart-dot', g);
      if (!dot) return;
      const dx = Number(dot.getAttribute('cx')) - px, dy = Number(dot.getAttribute('cy')) - py;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = g; }
    });
    const max = 22 * Math.max(G.W / rect.width, G.H / rect.height);
    return best && bestD <= max * max ? { s: +best.dataset.s, i: +best.dataset.i } : null;
  }

  function selectPoint(si, i) {
    const same = state.selected && state.selected.s === si && state.selected.i === i;
    state.selected = same ? null : { s: si, i };
    hideTip();
    draw();
  }

  root.addEventListener('click', e => {
    const period = e.target.closest?.('[data-period]');
    if (period) return applyPeriod(period.dataset.period);
    const z = e.target.closest?.('[data-zoom]');
    if (z) {
      if (z.dataset.zoom === 'reset') return resetView();
      return zoomAt(z.dataset.zoom === 'in' ? .6 : 1 / .6, (state.viewStart + state.viewEnd) / 2);
    }
    if (e.target.closest?.('[data-detail-close]')) {
      state.selected = null;
      hideTip();
      return draw();
    }
  });

  svg.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    state.dragging = { x: e.clientX, start: state.viewStart, end: state.viewEnd, moved: false };
    try { svg.setPointerCapture(e.pointerId); } catch (_) { /* navegador antigo */ }
    root.classList.add('dragging');
  });

  svg.addEventListener('pointermove', e => {
    if (state.dragging) {
      const dx = e.clientX - state.dragging.x;
      if (Math.abs(dx) > 4) state.dragging.moved = true;
      if (state.dragging.moved) {
        const rect = svg.getBoundingClientRect();
        const dt = -dx * (G.W / (rect.width || 1)) * (state.dragging.end - state.dragging.start) / PW;
        setView(state.dragging.start + dt, state.dragging.end + dt);
        return;
      }
    }
    if (e.pointerType !== 'touch') handleHover(e);
  });

  const endDrag = e => {
    const drag = state.dragging;
    state.dragging = null;
    root.classList.remove('dragging');
    if (drag && !drag.moved && e.type === 'pointerup') {
      const near = nearestPointFromEvent(e);
      if (near) selectPoint(near.s, near.i);
      else if (state.selected) { state.selected = null; draw(); }
    }
  };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('pointerleave', hideTip);
  svg.addEventListener('dblclick', e => { e.preventDefault(); resetView(); });
  svg.addEventListener('wheel', e => {
    if (!e.deltaY) return;
    e.preventDefault();
    zoomAt(e.deltaY > 0 ? 1.25 : .8, timeAtX(e.clientX));
    handleHover(e);
  }, { passive: false });

  svg.addEventListener('keydown', e => {
    const point = e.target.closest?.('.ph-point');
    if (point && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      return selectPoint(+point.dataset.s, +point.dataset.i);
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const d = (e.key === 'ArrowLeft' ? -1 : 1) * span() * .15;
      return setView(state.viewStart + d, state.viewEnd + d);
    }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); return zoomAt(.7, (state.viewStart + state.viewEnd) / 2); }
    if (e.key === '-' || e.key === '_') { e.preventDefault(); return zoomAt(1 / .7, (state.viewStart + state.viewEnd) / 2); }
    if (e.key === 'Home' || e.key === '0') { e.preventDefault(); return resetView(); }
  });

  draw();
}

  render(`<h2 class="ph-title mb-3">${id ? 'Editar' : 'Novo'} atleta</h2>
    <div class="card p-3" style="max-width:520px"><div class="d-flex align-items-center gap-3 mb-3">
      <div id="prev">${avatar(a, true)}</div><input type="file" id="file" accept="image/*" class="form-control"></div>
      <label class="form-label">Nome</label><input id="name" class="form-control mb-2" maxlength="100" value="${esc(a.name)}">

      <label class="form-label">Clube / equipe</label><input id="club" class="form-control mb-2" maxlength="80" value="${esc(a.club)}">
      <label class="form-label">Data de nascimento</label><input id="birth" type="date" class="form-control mb-2" value="${esc(a.birth_date ? String(a.birth_date).slice(0, 10) : '')}">
      <div class="row g-2 mb-2"><div class="col-12"><label class="form-label">Madeira (base da raquete)</label><input id="blade" class="form-control" maxlength="80" value="${esc(a.blade)}"></div>
        <div class="col-6"><label class="form-label">Borracha forehand</label><input id="rfh" class="form-control" maxlength="80" value="${esc(a.rubber_fh)}"></div>
        <div class="col-6"><label class="form-label">Borracha backhand</label><input id="rbh" class="form-control" maxlength="80" value="${esc(a.rubber_bh)}"></div></div>
      <label class="form-label">Sobre o atleta</label><textarea id="bio" class="form-control mb-3" rows="3" maxlength="500">${esc(a.bio)}</textarea>
      <div class="d-flex gap-2"><button id="save" class="btn btn-ph btn-go"><i class="bi bi-check-lg"></i> Salvar</button><a href="#/atletas${id ? '/' + id : ''}" class="btn btn-outline-secondary">Cancelar</a></div></div>`);
  let photo;   // undefined = não mudou
  $('#file').addEventListener('change', async e => {
    try {
      photo = await resizeImage(e.target.files[0]);
      $('#prev').innerHTML = `<img class="avatar avatar-lg" src="${photo}">`;
    } catch (err) { toast(err.message); }
  });
  $('#save').addEventListener('click', async () => {
    const body = { name: $('#name').value, nickname: $('#nick').value, hand: $('#hand').value,
      play_style: $('#style').value, game_style: $('#game').value,
      club: $('#club').value, birth_date: $('#birth').value, blade: $('#blade').value,
      rubber_fh: $('#rfh').value, rubber_bh: $('#rbh').value, bio: $('#bio').value };
    if (photo !== undefined) body.photo = photo;
    try {
      const saved = await api('/athletes' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body });
      go('#/atletas/' + saved.id);
    } catch (err) { toast(err.message); }
  });
}

function titleMedals(t) {
  return [['first', '🥇', '1º lugar'], ['second', '🥈', '2º lugar'], ['third', '🥉', '3º lugar']]
    .filter(([key]) => (t[key] || 0) > 0)
    .map(([key, icon, label]) => `<span class="ph-medal" title="${label}" aria-label="${label}">${icon} ${t[key]}</span>`)
    .join('');
}

const ageOf = d => {
  if (!d) return null;
  const b = new Date(d), n = new Date();
  return n.getFullYear() - b.getFullYear() - (n < new Date(n.getFullYear(), b.getMonth(), b.getDate()) ? 1 : 0);
};

function profileExtras(a, st) {
  const age = ageOf(a.birth_date);
  const line = [a.club && `<i class="bi bi-geo-alt"></i> ${esc(a.club)}`, age != null && `<i class="bi bi-cake2"></i> ${age} anos`].filter(Boolean).join(' &nbsp;·&nbsp; ');

let ATHLETES = [];

// ---- regras de pontuação (puras) ----
const setWon = (c, target) => Math.max(...c) >= target && (target < 11 || Math.abs(c[0] - c[1]) >= 2);

function compute(log, cfg) {
  const need = Math.ceil(cfg.best_of / 2), sets = [], w = [0, 0];
  let c = [0, 0];
  for (const side of log) {
    c[side]++;
    if (setWon(c, cfg.points)) {
      sets.push([...c]); w[c[0] > c[1] ? 0 : 1]++; c = [0, 0];
      if (cfg.mode === 'competitive' && (w[0] === need || w[1] === need)) return { sets, c, w, done: true };
    }
  }
  return { sets, c, w, done: false };
}

// ---- placar ao vivo ----
async function startPlay(cfg) {
  const log = [], t0 = Date.now(), coop = cfg.mode === 'cooperative', need = Math.ceil(cfg.best_of / 2);
  let saved = false, lastTap = 0, wake = null, tick, prev = [0, 0], prevW = [0, 0];
  let swapped = false, toUsed = [false, false], toEnd = 0, toWho = '', noticeTimer;
  const names = [cfg.p1.name, cfg.p2.name];

  render(`<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <div><span class="badge text-bg-info fs-6" id="setLabel"></span> <span id="clock" class="ms-2 fs-4 fw-bold ${coop ? 'd-none' : ''}"></span></div>
      <div class="btn-group"><button id="undo" class="btn btn-outline-light ${coop ? 'd-none' : ''}"><i class="bi bi-arrow-counterclockwise"></i> Desfazer</button>
      <button id="end" class="btn btn-outline-danger">${coop ? 'Encerrar' : 'Cancelar'}</button></div></div>
    <div id="scoreTop" class="d-flex gap-2 flex-wrap mb-2 ${coop ? 'd-none' : ''}"></div>
    <div id="score" class="score-area"></div><div id="alert" class="mt-3"></div>
    <div id="toLayer"></div>
    <div class="hint text-center mt-3 d-none d-md-block">${coop ? 'Treino cooperativo: apenas o tempo.' : '<kbd>←</kbd> <kbd>→</kbd> marcam ponto · <kbd>Backspace</kbd> desfaz'}</div>`);

  const notice = (html, ms = 6000) => {
    $('#alert').innerHTML = `<div class="notice">${html}</div>`;
    clearTimeout(noticeTimer);
    if (ms) noticeTimer = setTimeout(() => { $('#alert').innerHTML = ''; }, ms);
  };

  // Saque: 2 pontos para cada, alternando; em 10-10, 1 ponto para cada. O primeiro
  // sacador de cada set alterna (quem começou sacando no set 1 recebe no set 2...).
  const serverOf = st => {
    const first = ((cfg.server ?? 0) + st.sets.length) % 2;
    const total = st.c[0] + st.c[1];
    return total < 20 ? first ^ (Math.floor(total / 2) % 2) : first ^ ((total - 20) % 2);
  };

  const draw = () => {
    if (coop) {
      const left = Math.max(0, cfg.minutes * 60 - (Date.now() - t0) / 1000);
      $('#setLabel').textContent = 'Treino cooperativo';
      $('#score').innerHTML = `<div class="card p-4 text-center" style="grid-column:1/-1">
        <div class="h5 mb-1"><span class="pdot" style="background:var(--p1)"></span> ${esc(names[0])}
          <span class="text-secondary mx-2">com</span> <span class="pdot" style="background:var(--p2)"></span> ${esc(names[1])}</div>
        <div class="display-1 fw-bold score-tile" id="coopClock">${fmtDur(left)}</div>
        <div class="text-secondary">Tempo restante</div></div>`;
      $('#undo').disabled = true;
      return;
    }

    const st = compute(log, cfg);
    const serve = cfg.points >= 7 ? serverOf(st) : -1;
    const canWin = i => !st.done && setWon(i ? [st.c[0], st.c[1] + 1] : [st.c[0] + 1, st.c[1]], cfg.points);
    const tag = i => !canWin(i) ? '' : `<div class="point-tag">${st.w[i] === need - 1 ? 'Ponto de partida' : 'Ponto de set'}</div>`;
    if (!swapped && cfg.points >= 7 && st.w[0] === need - 1 && st.w[1] === need - 1 && Math.max(...st.c) >= Math.floor(cfg.points / 2)) {
      swapped = true; notice('<i class="bi bi-arrow-left-right"></i> Set decisivo: troquem de lado');
    }
    $('#scoreTop').innerHTML = [0, 1].map(i => `<button class="btn btn-outline-light btn-sm flex-fill text-truncate" data-to="${i}"
      ${toUsed[i] || toEnd || st.done ? 'disabled' : ''}><i class="bi bi-stopwatch"></i> ${toUsed[i] ? 'Time-out usado' : `Time-out · ${esc(names[i])}`}</button>`).join('');
    $('#setLabel').textContent = `Set ${st.sets.length + 1} • melhor de ${cfg.best_of} • até ${cfg.points}`;
    $('#score').innerHTML = [0, 1].map(i => {
      const pop = st.c[i] > prev[i] ? ' score-pop' : '';
      return `<div class="side">
      <div class="pname">${esc(names[i])}${serve === i ? '<span class="serve-tag"><i class="bi bi-circle-fill"></i> Saque</span>' : ''}</div>${tag(i)}
      <div class="my-1">${Array.from({ length: need }, (_, k) => `<span class="set-dot ${k < st.w[i] ? 'on' : ''}${k >= prevW[i] && k < st.w[i] ? ' new' : ''}"></span>`).join('')}</div>
      <div class="big-score${pop}">${st.c[i]}</div>
      <button class="btn btn-ph pt-btn mt-2" data-side="${i}" ${st.done ? 'disabled' : ''}>+1</button></div>`;
    }).join('');
    prev = [...st.c];
    prevW = [...st.w];
    $('#undo').disabled = !log.length;
    if (st.done) finish();
  };

  const endTimeout = sound => {
    toEnd = 0; $('#toLayer').innerHTML = '';
    if (sound) beep();
    draw();
  };

  const clock = () => {
    const el = (Date.now() - t0) / 1000;
    if (toEnd) {
      const left = Math.ceil((toEnd - Date.now()) / 1000);
      if (left > 0) {
        if (!$('#toTime')) $('#toLayer').innerHTML = `<div class="to-overlay" role="dialog" aria-label="Time-out"><div class="to-card">
          <div class="to-title"><i class="bi bi-stopwatch"></i> Time-out</div><div class="to-who">${esc(toWho)}</div>
          <div class="to-time" id="toTime"></div><div class="to-bar"><span id="toBar"></span></div>
          <button id="toSkip" class="btn btn-ph btn-go w-100 mt-3"><i class="bi bi-play-fill"></i> Retomar jogo</button></div></div>`;
        $('#toTime').textContent = fmtDur(left);
        $('#toTime').classList.toggle('to-low', left <= 10);
        $('#toBar').style.width = Math.min(100, left / 60 * 100) + '%';
      } else endTimeout(true);
    }
    if (coop) {
      const left = Math.max(0, cfg.minutes * 60 - el);
      const timer = $('#coopClock');
      if (timer) timer.textContent = fmtDur(left);
      if (left === 0) { beep(); finish(); }
    } else $('#clock').textContent = fmtDur(el);
  };

  async function finish() {
    if (saved) return;
    saved = true; clearInterval(tick);
    const duration = Math.round((Date.now() - t0) / 1000);
    if (coop) {
      try {
        const res = await api('/matches', { method: 'POST', body: {
          mode: 'cooperative', modality: cfg.modality, duration, notes: cfg.notes,
          player1: cfg.p1, player2: cfg.p2 } });
        showResult(cfg, res, [], duration);
      } catch (e) {
        saved = false;
        render(`<div class="alert alert-danger">Não foi possível salvar: ${esc(e.message)}</div>
          <button id="retry" class="btn btn-ph btn-go">Tentar salvar de novo</button>`);
        $('#retry').addEventListener('click', finish);
      }
      return;
    }
    const st = compute(log, cfg), sets = [...st.sets];
    if (st.c[0] + st.c[1] > 0) sets.push([...st.c]);                   // set parcial (treino)
    if (!sets.length) { go('#/partida'); return; }
    try {
      const res = await api('/matches', { method: 'POST', body: {
        mode: cfg.mode, modality: cfg.modality, points_per_set: cfg.points, best_of: cfg.best_of,
        duration, sets, notes: cfg.notes, tournament_match_id: cfg.tm, player1: cfg.p1, player2: cfg.p2 } });
      showResult(cfg, res, sets, duration);
    } catch (e) {
      saved = false;
      render(`<div class="alert alert-danger">Não foi possível salvar: ${esc(e.message)}</div>
        <button id="retry" class="btn btn-ph btn-go">Tentar salvar de novo</button>`);
      $('#retry').addEventListener('click', finish);
    }
  }

  $('#scoreTop').addEventListener('click', e => {
    const t = e.target.closest('[data-to]');
    if (!t) return;
    const i = +t.dataset.to;
    if (!toUsed[i] && !toEnd) { toUsed[i] = true; toEnd = Date.now() + 60000; toWho = names[i]; draw(); clock(); }
  });
  $('#score').addEventListener('click', e => {
    const b = e.target.closest('[data-side]');
    if (!b || Date.now() - lastTap < 250) return;       // evita toque duplo
    lastTap = Date.now(); log.push(+b.dataset.side); draw();
  });
  $('#toLayer').addEventListener('click', e => { if (e.target.closest('#toSkip')) endTimeout(false); });
  $('#undo').addEventListener('click', () => { if (!coop) { log.pop(); draw(); } });
  const onKey = e => {                                  // atalhos de teclado (computador)
    if (coop || toEnd || e.target.matches?.('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowLeft') $('[data-side="0"]')?.click();
    else if (e.key === 'ArrowRight') $('[data-side="1"]')?.click();
    else if (e.key === 'Backspace' || e.key.toLowerCase() === 'z') { e.preventDefault(); $('#undo').click(); }
  };
  document.addEventListener('keydown', onKey);
  $('#end').addEventListener('click', () => {
    if (coop) return finish();
    if (confirm('Cancelar a partida? O resultado não será salvo.')) go(cfg.tid ? '#/torneio/' + cfg.tid : '#/partida');
  });

  try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { /* opcional */ }
  tick = setInterval(clock, 1000);
  PH.cleanup = () => { clearInterval(tick); wake?.release?.(); document.removeEventListener('keydown', onKey); };
  draw(); clock();
}

function tournamentSummary(sum) {
  const t = sum.tournament, st = sum.standings || [], games = sum.matches || [];
  const medal = p => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : '';
  const main = games.filter(m => !m.third_place);
  const totalRounds = Math.max(1, ...main.map(m => m.round || 1));
  const label = m => m.third_place ? 'Disputa de 3º lugar' : t.type === 'round_robin' ? 'Todos contra todos'
    : roundLabel(m.round, totalRounds);
  const row = (name, score, win) => `<div class="row-p ${win ? 'win' : ''}"><span>${esc(name)}</span><span>${score ?? ''}</span></div>`;
  render(`<div class="mx-auto" style="max-width:900px"><div class="card p-4 text-center mb-3">
      <div class="eyebrow">Torneio encerrado</div><h2 class="ph-title mt-1">${esc(t.name)}</h2>
      <div class="display-5 fw-bold mb-1">🏆 ${esc(sum.champion_name || st[0]?.name || '')}</div>
      <div class="text-secondary mb-3">${TYPE[t.type]} • ${fmtDate(t.date)}${t.location ? ` • ${esc(t.location)}` : ''}</div>
      <div class="alert alert-success mb-3">O evento foi removido da lista automaticamente. Títulos, partidas e ELO continuam salvos.</div>
      <div class="d-flex gap-2 justify-content-center flex-wrap"><a href="#/torneio" class="btn btn-ph">Voltar aos torneios</a>
      <a href="#/ranking" class="btn btn-outline-light">Ver ranking</a></div></div>
    <div class="row g-3"><div class="col-lg-5"><div class="card p-3 h-100"><h5>Classificação final</h5>
      ${st.map(s => `<div class="d-flex justify-content-between align-items-center border-bottom py-2">
        <span>${medal(s.place)} ${esc(s.name)}</span><span class="text-secondary">${s.place}º</span></div>`).join('')}</div></div>
      <div class="col-lg-7"><div class="card p-3 h-100"><h5>Resultados</h5>
      ${games.map(m => `<div class="bm mb-2"><div class="small text-secondary">${label(m)}</div>
        ${row(m.player1_name, m.sets_p1, m.winner_id === m.player1_id)}${row(m.player2_name, m.sets_p2, m.winner_id === m.player2_id)}</div>`).join('')
        || '<span class="text-secondary">Nenhuma partida jogada.</span>'}</div></div></div></div>`);
}

function showResult(cfg, res, sets, duration) {
  if (res.tournament_result) return tournamentSummary(res.tournament_result);
  if (cfg.mode === 'cooperative') {
    render(`<div class="card p-4 text-center mx-auto" style="max-width:560px">
      <h2>Treino cooperativo encerrado</h2>
      <div class="display-2 fw-bold score-tile">${fmtDur(duration)}</div>
      <div class="text-secondary mb-3">${esc(cfg.p1.name)} <span class="mx-1">com</span> ${esc(cfg.p2.name)}</div>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <button id="again" class="btn btn-ph">Revanche</button><a class="btn btn-outline-light" href="#/partida">Nova partida</a>
        <a class="btn btn-outline-light" href="#/ranking">Ranking</a></div></div>`);
    $('#again')?.addEventListener('click', () => startPlay(cfg));
    return;
  }
  const winner = res.winner ? [cfg.p1.name, cfg.p2.name][res.winner - 1] : null;
  const eloRow = (n, p) => `<div class="d-flex justify-content-between"><span>${esc(n)}</span><span>${p.before} → <b>${p.after}</b> ${delta(p.delta)}</span></div>`;
  render(`<div class="card p-4 text-center mx-auto" style="max-width:560px">
    <h2>${winner ? '🏆 ' + esc(winner) : 'Partida encerrada'}</h2>
    <div class="display-3 fw-bold">${res.sets_p1} x ${res.sets_p2}</div>
    <div class="text-secondary mb-3">${sets.map(s => s.join('-')).join(' · ')} • ${fmtDur(duration)}</div>
    ${res.elo ? `<div class="text-start border-top pt-3 mb-3">${eloRow(cfg.p1.name, res.elo.player1)}${eloRow(cfg.p2.name, res.elo.player2)}</div>`
      : `<div class="hint border-top pt-3 mb-3"><i class="bi bi-info-circle"></i> Esta partida não alterou o ELO (sets de 3 pontos, duplas ou adversário anônimo).</div>`}
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      ${cfg.tid ? `<a class="btn btn-ph" href="#/torneio/${cfg.tid}">Voltar ao torneio</a>` :
        `<button id="again" class="btn btn-ph">Revanche</button><a class="btn btn-outline-light" href="#/partida">Nova partida</a>`}
      <a class="btn btn-outline-light" href="#/ranking">Ranking</a></div></div>`);
  $('#again')?.addEventListener('click', () => startPlay(cfg));
}
