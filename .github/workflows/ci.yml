name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Testes unitários e contratos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lógica de torneios/partidas/ELO
        run: python test_app.py
      - name: Contratos de produção
        run: python test_production.py

  postgres:
    name: Integração PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinghub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PINGHUB_TEST_DB: "1"
      PINGHUB_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pinghub
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: ci-only-admin-password
      DB_AUTO_INIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testar API contra PostgreSQL real
        run: python test_postgres.py
